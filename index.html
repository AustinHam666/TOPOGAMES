<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topogames</title>
<meta name="description" content="Topogames — indie game studio. Office Together, game jam.">
<meta property="og:title" content="Topogames">
<meta property="og:description" content="Office Together · game jam · contacto">
<meta property="og:image" content="avatar-light.png">
<link rel="icon" href="avatar-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Permanent+Marker&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: un escritorio de oficina. Hoja cuadriculada de fondo, avatar dibujado a mano,
   links como post-its pegados, aviones de papel volando detrás. Una columna, pensada para celular. */
:root{
  --paper:#f6f7f2;      /* hoja */
  --grid:#d9e2ec;       /* cuadrícula */
  --ink:#141414;        /* marcador, igual que el dibujo */
  --muted:#55606b;
  --note-y:#ffe066;     /* post-it amarillo */
  --note-p:#ff9ec4;     /* post-it rosa */
  --note-b:#9ad8ff;     /* post-it celeste */
  --stamp:#e63946;      /* sello rojo de oficina */
  --shadow:rgba(20,20,20,.18);
  --display:"Lilita One","Permanent Marker","Comic Sans MS","Marker Felt",cursive;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#16181d;--grid:#262a33;--ink:#f2f2ee;--muted:#a3abb5;
    --note-y:#ffd43b;--note-p:#ff8fb8;--note-b:#74c8ff;--stamp:#ff5a65;--shadow:rgba(0,0,0,.5);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
/* margen rojo de cuaderno */
body::after{content:"";position:fixed;top:0;bottom:0;left:max(10px,calc(50% - 300px));width:2px;background:var(--stamp);opacity:.25;pointer-events:none;z-index:0}
#planes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;display:grid;gap:30px}

/* idioma */
.langs{display:flex;justify-content:flex-end;gap:6px}
.langs button{font-family:var(--mono);font-size:13px;padding:6px 10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:3px;cursor:pointer;transition:transform .15s}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs button:hover{transform:translateY(-2px) rotate(-2deg)}
button:focus-visible,a:focus-visible{outline:3px dashed var(--stamp);outline-offset:3px}

/* cabecera */
header{display:grid;justify-items:center;gap:6px;text-align:center}
.avatar-wrap{width:min(78%,300px);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:pop .7s cubic-bezier(.34,1.56,.64,1) backwards}
.avatar{display:block;width:100%;height:auto;transform-origin:50% 90%;animation:bob 3.2s ease-in-out infinite;transition:transform .2s}
.avatar-wrap.boing .avatar{animation:boing .5s ease}
.bubble{font-family:var(--display);font-size:15px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:4px 12px;
  position:relative;margin-bottom:-4px;transform:rotate(-3deg);animation:pop .6s .5s cubic-bezier(.34,1.56,.64,1) backwards}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1;margin:6px 0 0;letter-spacing:.01em;position:relative}
h1 span{display:inline-block;animation:drop .5s cubic-bezier(.34,1.56,.64,1) backwards}
.underline{display:block;width:min(90%,320px);height:18px;margin:-4px auto 0}
.underline path{fill:none;stroke:var(--stamp);stroke-width:5;stroke-linecap:round;stroke-dasharray:400;animation:draw 1s .9s ease-out backwards}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{margin:4px 0 0;max-width:34ch;color:var(--muted);text-wrap:balance}

/* secciones */
section{display:grid;gap:16px}
h2{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:10px;font-weight:500}
h2::after{content:"";flex:1;border-top:2px dashed var(--grid)}

/* post-its */
.note{--r:-1.5deg;--c:var(--note-y);position:relative;display:flex;align-items:center;gap:14px;padding:20px 18px 18px;background:var(--c);color:#141414;
  text-decoration:none;border-radius:2px 2px 18px 2px;box-shadow:0 10px 18px -10px var(--shadow),0 2px 0 rgba(0,0,0,.06);
  transform:rotate(var(--r));transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
  animation:stick .6s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d,0s)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);
  background:rgba(255,255,255,.55);border-left:2px dotted rgba(0,0,0,.08);border-right:2px dotted rgba(0,0,0,.08)}
a.note:hover,a.note:focus-visible{transform:rotate(0deg) translateY(-4px) scale(1.02);box-shadow:0 18px 26px -12px var(--shadow)}
a.note:active{transform:scale(.97)}
.note.game{--c:var(--note-y);--r:-2deg;padding-block:26px}
.note.deck{--c:#fd8a28;--r:1.2deg}
.note.li{--c:var(--note-b);--r:1.5deg}
.note.mail{--c:var(--note-p);--r:-1deg;flex-wrap:wrap}
.ico{flex:none;width:48px;height:48px;display:grid;place-items:center;border:2.5px solid #141414;border-radius:50%;font-family:var(--display);font-size:20px;background:rgba(255,255,255,.5)}
.game .ico{width:58px;height:58px;font-size:24px;border-radius:12px}
.txt{display:grid;gap:1px;min-width:0;flex:1}
.txt strong{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.15}
.game .txt strong{font-size:1.7rem}
.txt span{font-size:15px;opacity:.8;overflow-wrap:anywhere}
.arrow{flex:none;font-family:var(--display);font-size:26px;transition:transform .25s}
a.note:hover .arrow{transform:translateX(5px) rotate(-8deg)}
.addr{font-family:var(--mono);font-size:14px;word-break:break-all;user-select:all;opacity:1!important}
.copy{flex:none;font-family:var(--mono);font-size:13px;font-weight:500;padding:8px 12px;border:2.5px solid #141414;background:#fff;color:#141414;border-radius:3px;cursor:pointer;
  box-shadow:3px 3px 0 #141414;transition:transform .1s,box-shadow .1s}
.copy:active{transform:translate(3px,3px);box-shadow:0 0 0 #141414}
.stamp{position:absolute;right:14px;top:-12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--stamp);border:2px solid var(--stamp);
  padding:2px 6px;border-radius:3px;transform:rotate(8deg);background:var(--paper);pointer-events:none;opacity:0;transition:opacity .2s,transform .3s}
.stamp.on{opacity:1;transform:rotate(-6deg) scale(1.1)}

footer{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;display:grid;gap:4px}
footer b{font-family:var(--display);font-weight:400;color:var(--ink);font-size:14px;letter-spacing:0}

@keyframes pop{from{transform:scale(.4) rotate(-8deg)}}
@keyframes drop{from{transform:translateY(-40px) rotate(-12deg)}}
@keyframes stick{from{transform:translateY(30px) rotate(calc(var(--r) * -4)) scale(.9)}}
@keyframes draw{from{stroke-dashoffset:400}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.15,.85)}55%{transform:scale(.92,1.1)}80%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="planes" aria-hidden="true"></canvas>
<main>
  <div class="langs" role="group" aria-label="Language">
    <button id="l-es" data-l="es" aria-pressed="true">ES</button>
    <button id="l-en" data-l="en" aria-pressed="false">EN</button>
    <button id="l-pt" data-l="pt" aria-pressed="false">PT</button>
  </div>

  <header>
    <div class="bubble" data-k="hi"></div>
    <div class="avatar-wrap" id="avatar" role="button" tabindex="0" aria-label="Austin Ham">
      <picture>
        <source srcset="avatar-dark.png" media="(prefers-color-scheme: dark)">
        <img class="avatar" src="avatar-light.png" alt="Dibujo de Austin Ham" width="640" height="376">
      </picture>
    </div>
    <div class="tag" data-k="tag"></div>
    <h1 id="title" aria-label="Topogames"></h1>
    <svg class="underline" viewBox="0 0 320 18" preserveAspectRatio="none" aria-hidden="true"><path d="M6 12 C 70 4, 130 16, 190 8 S 290 6, 314 10"/></svg>
    <p class="sub" data-k="sub"></p>
  </header>

  <section>
    <h2 data-k="h_game"></h2>
    <a class="note game" style="--d:.9s" href="https://juanvh241.itch.io/office-together" target="_blank" rel="noopener">
      <div class="ico">▶</div>
      <div class="txt"><strong>Office Together</strong><span data-k="game"></span></div>
      <div class="arrow">→</div>
    </a>
    <a class="note deck" style="--d:1s" href="presentacion.html">
      <div class="ico">▤</div>
      <div class="txt"><strong data-k="deck"></strong><span data-k="deck_sub"></span></div>
      <div class="arrow">→</div>
    </a>
  </section>

  <section>
    <h2 data-k="h_contact"></h2>
    <a class="note li" style="--d:1.1s" href="https://www.linkedin.com/in/austinham/" target="_blank" rel="noopener">
      <div class="ico">in</div>
      <div class="txt"><strong>Austin Ham</strong><span>LinkedIn</span></div>
      <div class="arrow">→</div>
    </a>
    <div class="note mail" style="--d:1.25s">
      <div class="ico">@</div>
      <div class="txt"><strong>Email</strong><span class="addr" id="addr">austinham106@gmail.com</span></div>
      <button class="copy" id="copy" type="button" data-k="copy"></button>
      <div class="stamp" id="stamp" data-k="copied"></div>
    </div>
  </section>

  <footer>
    <b>Topogames</b>
    <span data-k="foot"></span>
  </footer>
</main>
<script>
const T={
 es:{hi:"¡Hola! 👋",tag:"Estudio indie de videojuegos",sub:"Hicimos Office Together en una game jam. Jugalo y escribinos.",h_game:"El juego",game:"Jugalo gratis en itch.io",deck:"Presentación",deck_sub:"Cómo funciona el juego, en 9 diapositivas",h_contact:"Contacto",copy:"COPIAR",copied:"¡COPIADO!",foot:"Hecho con café en la oficina ☕",
   pokes:["¡Hola! 👋","¡Ey, eso hace cosquillas!","¿Jugaste Office Together?","Mejor juntos 🤝","¡Otra vez no!"]},
 en:{hi:"Hi there! 👋",tag:"Indie game studio",sub:"We made Office Together at a game jam. Play it and say hi.",h_game:"The game",game:"Play it free on itch.io",deck:"Pitch deck",deck_sub:"How the game works, in 9 slides",h_contact:"Contact",copy:"COPY",copied:"COPIED!",foot:"Made with coffee at the office ☕",
   pokes:["Hi there! 👋","Hey, that tickles!","Have you played Office Together?","Better together 🤝","Not again!"]},
 pt:{hi:"Olá! 👋",tag:"Estúdio indie de jogos",sub:"Fizemos Office Together numa game jam. Jogue e fale com a gente.",h_game:"O jogo",game:"Jogue grátis no itch.io",deck:"Apresentação",deck_sub:"Como o jogo funciona, em 9 slides",h_contact:"Contato",copy:"COPIAR",copied:"COPIADO!",foot:"Feito com café no escritório ☕",
   pokes:["Olá! 👋","Ei, isso faz cócegas!","Já jogou Office Together?","Melhor juntos 🤝","De novo não!"]}
};
let cur="es",poke=0;
const $=s=>document.querySelector(s);

// título letra por letra
$("#title").innerHTML=[..."Topogames"].map((c,i)=>`<span style="animation-delay:${.25+i*.05}s">${c}</span>`).join("");

function set(l){
  cur=l;document.documentElement.lang=l;poke=0;
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=T[l][e.dataset.k]);
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>set(b.dataset.l)));

// avatar: rebota y dice algo al tocarlo
const av=$("#avatar");
function boing(){
  av.classList.remove("boing");void av.offsetWidth;av.classList.add("boing");
  poke=(poke+1)%T[cur].pokes.length;$(".bubble").textContent=T[cur].pokes[poke];
  burst(av.getBoundingClientRect());
}
av.addEventListener("click",boing);
av.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();boing()}});

// copiar mail
$("#copy").addEventListener("click",()=>{
  const st=$("#stamp"),ok=()=>{st.classList.add("on");setTimeout(()=>st.classList.remove("on"),1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents($("#addr"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText("austinham106@gmail.com").then(ok,sel)}catch(e){sel()}
  burst($("#copy").getBoundingClientRect());
});

// aviones de papel + papelitos
const cv=$("#planes"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,planes=[],bits=[];
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);size();
const ink=()=>getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
const cols=()=>["--note-y","--note-p","--note-b","--stamp"].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());
function newPlane(x){return{x:x??-60,y:H*(.1+Math.random()*.8),s:.6+Math.random()*.6,v:.5+Math.random()*.7,ph:Math.random()*6.28,a:.18+Math.random()*.15}}
for(let i=0;i<4;i++)planes.push(newPlane(Math.random()*W));
function drawPlane(p,t){
  const y=p.y+Math.sin(t/900+p.ph)*18,ang=Math.cos(t/900+p.ph)*.25;
  cx.save();cx.translate(p.x,y);cx.rotate(ang);cx.scale(p.s,p.s);cx.globalAlpha=p.a;
  cx.strokeStyle=ink();cx.lineWidth=2.5;cx.lineJoin="round";
  cx.beginPath();cx.moveTo(30,0);cx.lineTo(-24,-14);cx.lineTo(-12,0);cx.lineTo(-24,14);cx.closePath();cx.stroke();
  cx.beginPath();cx.moveTo(30,0);cx.lineTo(-12,0);cx.lineTo(-18,8);cx.stroke();
  cx.restore();
}
function burst(r){
  if(still)return;const c=cols();
  for(let i=0;i<18;i++)bits.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*9,vy:-Math.random()*8-2,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:c[i%4],l:1});
}
function frame(t){
  cx.clearRect(0,0,W,H);
  planes.forEach((p,i)=>{p.x+=p.v;if(p.x>W+60)planes[i]=newPlane();drawPlane(p,t)});
  bits=bits.filter(b=>b.l>0);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.3;b.vx*=.98;b.r+=b.vr;b.l-=.012;
    cx.save();cx.globalAlpha=Math.max(b.l,0);cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-5,-3,10,6);cx.restore()});
  requestAnimationFrame(frame);
}
if(!still)requestAnimationFrame(frame);else{planes.forEach(p=>drawPlane(p,0))}

// idioma inicial
let l="";try{l=localStorage.getItem("lang")||""}catch(e){}
if(!T[l]){const n=(navigator.language||"es").slice(0,2);l=T[n]?n:"en"}
set(l);
</script>
</body>
</html>
