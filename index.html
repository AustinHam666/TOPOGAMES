<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topogames Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: tarjeta centrada tipo pantalla de selección, selector de idioma arriba, juego + contacto, botones grandes para celular */
:root{--bg:#eef0f7;--card:#ffffff;--fg:#1b1d2e;--muted:#5d6180;--accent:#ff4f7b;--line:#d8dbea;
--display:"Silkscreen",ui-monospace,monospace;--body:"Rubik",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13141f;--card:#1d1f2e;--fg:#eceefa;--muted:#9a9ebd;--accent:#ff6b92;--line:#2f3247;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13141f;--card:#1d1f2e;--fg:#eceefa;--muted:#9a9ebd;--accent:#ff6b92;--line:#2f3247;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
main{max-width:420px;margin:0 auto;display:grid;gap:28px}
.langs{display:flex;justify-content:center;gap:8px}
.langs button{font-family:var(--display);font-size:13px;letter-spacing:.08em;padding:8px 14px;border:2px solid var(--line);
background:var(--card);color:var(--muted);border-radius:4px;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);box-shadow:3px 3px 0 var(--accent)}
.langs button:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:grid;gap:8px;text-align:center}
.tag{font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--accent)}
h1{font-family:var(--display);font-size:2.4rem;margin:0;line-height:1.1}
h2{font-family:var(--display);font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:400}
p{margin:0;color:var(--muted);line-height:1.5}
section{display:grid;gap:14px}
.btn{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card);border:2px solid var(--line);
border-radius:6px;color:var(--fg);text-decoration:none;box-shadow:4px 4px 0 var(--accent);transition:transform .12s,box-shadow .12s}
a.btn:hover,a.btn:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--accent);outline:none;border-color:var(--accent)}
.ico{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:4px;background:var(--accent);color:#fff;font-family:var(--display);font-size:14px}
.txt{display:grid;gap:2px;min-width:0;flex:1}
.txt strong{font-weight:600}
.txt span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.mail{user-select:all;color:var(--fg)!important;font-size:15px!important}
.copy{flex:none;font-family:var(--display);font-size:11px;letter-spacing:.06em;padding:8px 10px;border:2px solid var(--accent);
background:transparent;color:var(--fg);border-radius:4px;cursor:pointer}
footer{text-align:center;font-family:var(--display);font-size:11px;color:var(--muted);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <div class="langs" role="group" aria-label="Language">
    <button id="l-es" data-l="es" aria-pressed="true">ES</button>
    <button id="l-en" data-l="en" aria-pressed="false">EN</button>
    <button id="l-pt" data-l="pt" aria-pressed="false">PT</button>
  </div>
  <header>
    <div class="tag" data-k="tag"></div>
    <h1>Topogames</h1>
    <p data-k="sub"></p>
  </header>
  <section>
    <h2 data-k="h_game"></h2>
    <a class="btn" href="https://juanvh241.itch.io/office-together" target="_blank" rel="noopener">
      <div class="ico">▶</div>
      <div class="txt"><strong>Office Together</strong><span data-k="game"></span></div>
    </a>
  </section>
  <section>
    <h2 data-k="h_contact"></h2>
    <a class="btn" href="https://www.linkedin.com/in/austinham/" target="_blank" rel="noopener">
      <div class="ico">in</div>
      <div class="txt"><strong>Austin Ham</strong><span>LinkedIn</span></div>
    </a>
    <div class="btn">
      <div class="ico">@</div>
      <div class="txt"><strong>Email</strong><span class="mail" id="mail">austinham106@gmail.com</span></div>
      <button class="copy" id="copy" data-k="copy"></button>
    </div>
  </section>
  <footer>PRESS START</footer>
</main>
<script>
const T={
 es:{tag:"ESTUDIO INDIE",sub:"Hicimos Office Together para una game jam. Probá el juego y escribinos.",h_game:"EL JUEGO",game:"Jugalo en itch.io",h_contact:"CONTACTO",copy:"COPIAR",copied:"¡COPIADO!"},
 en:{tag:"INDIE STUDIO",sub:"We made Office Together for a game jam. Play the game and get in touch.",h_game:"THE GAME",game:"Play it on itch.io",h_contact:"CONTACT",copy:"COPY",copied:"COPIED!"},
 pt:{tag:"ESTÚDIO INDIE",sub:"Fizemos Office Together para uma game jam. Jogue e fale com a gente.",h_game:"O JOGO",game:"Jogue no itch.io",h_contact:"CONTATO",copy:"COPIAR",copied:"COPIADO!"}
};
let cur="es";
function set(l){
 cur=l;document.documentElement.lang=l;
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=T[l][e.dataset.k]);
 document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
 try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>set(b.dataset.l));
document.getElementById("copy").onclick=function(){
 const btn=this,done=()=>{btn.textContent=T[cur].copied;setTimeout(()=>btn.textContent=T[cur].copy,1500)};
 const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
 try{navigator.clipboard.writeText("austinham106@gmail.com").then(done,sel)}catch(e){sel()}
};
let l="";
try{l=localStorage.getItem("lang")||""}catch(e){}
if(!T[l]){const n=(navigator.language||"es").slice(0,2);l=T[n]?n:"en"}
set(l);
</script>
</body>
</html>
