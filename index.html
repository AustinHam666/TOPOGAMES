<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topogames</title>
<meta name="description" content="Topogames — indie game studio. Office Together, game jam.">
<meta property="og:title" content="Topogames">
<meta property="og:description" content="Office Together · game jam · contacto">
<meta property="og:image" content="avatar-light.png">
<link rel="icon" href="avatar-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Patrick+Hand&display=swap">
<style>
/* Layout: la oficina de Office Together. Fondo petróleo con rayas, tarjetas crema con borde negro y sombra dura,
   etiquetas amarillas/naranjas como en el juego. Una columna, pensada para celular. Diseño de un solo tema (el del juego). */
:root{
  --paper:#144f54;      /* fondo petróleo del juego */
  --paper2:#0f3f43;
  --grid:rgba(255,255,255,.035);
  --ink:#fbf3de;        /* texto sobre el fondo (crema) */
  --line:#141414;       /* bordes negros */
  --cream:#fbf3de;
  --muted:#b9d3d1;
  --note-y:#ffd93b;     /* amarillo */
  --note-p:#fd8a28;     /* naranja */
  --note-b:#3d9bff;     /* azul J1 */
  --stamp:#ef4b4b;      /* rojo enojo */
  --green:#5ccb5f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.35;
  background-image:repeating-linear-gradient(45deg,transparent 0 22px,var(--grid) 22px 44px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
#planes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;display:grid;gap:30px}

/* idioma */
.langs{display:flex;justify-content:flex-end;gap:8px}
.langs button{font-family:var(--display);font-size:15px;padding:5px 11px;border:3px solid var(--line);background:var(--cream);color:var(--line);
  border-radius:6px;cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.langs button[aria-pressed="true"]{background:var(--note-y)}
.langs button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px dashed var(--note-y);outline-offset:4px}

/* cabecera */
header{display:grid;justify-items:center;gap:8px;text-align:center}
.avatar-wrap{width:min(72%,280px);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:pop .7s cubic-bezier(.34,1.56,.64,1) backwards;
  filter:drop-shadow(6px 6px 0 var(--line))}
.avatar{display:block;width:100%;height:auto;transform-origin:50% 90%;animation:bob 3.2s ease-in-out infinite}
.avatar-wrap.boing .avatar{animation:boing .5s ease}
.bubble{font-family:var(--body);font-size:19px;color:var(--line);background:var(--cream);border:3px solid var(--line);border-radius:12px;padding:2px 14px;
  position:relative;margin-bottom:-2px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--line);animation:pop .6s .5s cubic-bezier(.34,1.56,.64,1) backwards}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:14px;height:14px;background:var(--cream);border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateX(-50%) rotate(45deg)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,13vw,4.2rem);line-height:1;margin:4px 0 0;color:var(--note-p);
  -webkit-text-stroke:2px var(--line);paint-order:stroke fill;text-shadow:4px 4px 0 var(--line)}
h1 span{display:inline-block;animation:drop .5s cubic-bezier(.34,1.56,.64,1) backwards}
h1 span:nth-child(n+5){color:var(--cream)}
.underline{display:none}
.tag{font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--line);background:var(--note-y);
  border:3px solid var(--line);padding:3px 12px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--line);margin-top:8px}
.sub{margin:6px 0 0;max-width:30ch;color:var(--muted);text-wrap:balance;font-size:20px}

/* secciones */
section{display:grid;gap:18px}
h2{font-family:var(--display);font-size:22px;color:var(--cream);margin:0;display:flex;align-items:center;gap:10px;font-weight:400}
h2::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--cream) 0 10px,transparent 10px 18px);opacity:.25;border-radius:2px}

/* tarjetas tipo HUD del juego */
.note{--r:-1deg;--c:var(--cream);position:relative;display:flex;align-items:center;gap:14px;padding:16px;background:var(--c);color:var(--line);
  text-decoration:none;border:3.5px solid var(--line);border-radius:8px;box-shadow:6px 6px 0 var(--line);
  transform:rotate(var(--r));transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;
  animation:stick .6s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d,0s)}
.note::before{content:attr(data-label);position:absolute;top:-15px;right:14px;font-family:var(--display);font-size:13px;letter-spacing:.04em;
  background:var(--lc,var(--note-p));color:var(--line);border:3px solid var(--line);padding:1px 9px;transform:rotate(3deg)}
.note:not([data-label])::before{display:none}
a.note:hover,a.note:focus-visible{transform:rotate(0) translate(-2px,-3px);box-shadow:9px 9px 0 var(--line)}
a.note:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--line)}
.note.game{--r:-1.5deg;flex-direction:column;align-items:stretch;padding:0;overflow:visible}
.cover{display:block;width:100%;height:auto;border-bottom:3.5px solid var(--line);border-radius:4px 4px 0 0}
.game .row{display:flex;align-items:center;gap:14px;padding:14px 16px 16px}
.note.deck{--c:var(--note-y);--r:1.2deg;--lc:var(--cream)}
.note.li{--c:var(--note-b);--r:1deg}
.note.mail{--c:var(--note-p);--r:-1deg;flex-wrap:wrap}
.ico{flex:none;width:50px;height:50px;display:grid;place-items:center;border:3px solid var(--line);border-radius:50%;font-family:var(--display);font-size:22px;background:var(--cream);color:var(--line)}
.game .ico{background:var(--green);border-radius:10px}
.txt{display:grid;gap:0;min-width:0;flex:1}
.txt strong{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.1}
.game .txt strong{font-size:1.8rem}
.txt span{font-size:18px;overflow-wrap:anywhere}
.arrow{flex:none;font-family:var(--display);font-size:28px;transition:transform .25s}
a.note:hover .arrow{transform:translateX(5px)}
.addr{font-size:18px;user-select:all;word-break:break-all}
.copy{flex:none;font-family:var(--display);font-size:15px;padding:7px 12px;border:3px solid var(--line);background:var(--cream);color:var(--line);border-radius:6px;cursor:pointer;
  box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.copy:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.stamp{position:absolute;left:50%;top:-16px;font-family:var(--display);font-size:15px;color:var(--line);background:var(--green);border:3px solid var(--line);
  padding:2px 10px;border-radius:6px;transform:translateX(-50%) rotate(-4deg) scale(.6);pointer-events:none;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.stamp.on{opacity:1;transform:translateX(-50%) rotate(-4deg) scale(1)}

footer{text-align:center;color:var(--muted);display:grid;gap:4px;font-size:17px}
footer b{font-family:var(--display);font-weight:400;color:var(--cream);font-size:20px}

@keyframes pop{from{transform:scale(.4) rotate(-8deg)}}
@keyframes drop{from{transform:translateY(-40px) rotate(-12deg)}}
@keyframes stick{from{transform:translateY(30px) rotate(calc(var(--r) * -4)) scale(.9)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.15,.85)}55%{transform:scale(.92,1.1)}80%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="planes" aria-hidden="true"></canvas>
<main>
  <div class="langs" role="group" aria-label="Language">
    <button id="l-es" data-l="es" aria-pressed="true">ES</button>
    <button id="l-en" data-l="en" aria-pressed="false">EN</button>
    <button id="l-pt" data-l="pt" aria-pressed="false">PT</button>
  </div>

  <header>
    <div class="bubble" data-k="hi"></div>
    <div class="avatar-wrap" id="avatar" role="button" tabindex="0" aria-label="Austin Ham">
      <picture>
                <img class="avatar" src="avatar-light.png" alt="Dibujo de Austin Ham" width="640" height="376">
      </picture>
    </div>
    <div class="tag" data-k="tag"></div>
    <h1 id="title" aria-label="Topogames"></h1>
    <svg class="underline" viewBox="0 0 320 18" preserveAspectRatio="none" aria-hidden="true"><path d="M6 12 C 70 4, 130 16, 190 8 S 290 6, 314 10"/></svg>
    <p class="sub" data-k="sub"></p>
  </header>

  <section>
    <h2 data-k="h_game"></h2>
    <a class="note game" style="--d:.9s" data-label="ITCH.IO" href="https://juanvh241.itch.io/office-together" target="_blank" rel="noopener">
      <img class="cover" src="slides/1.jpg" alt="Office Together" width="1600" height="900">
      <div class="row">
        <div class="ico">▶</div>
        <div class="txt"><strong>Office Together</strong><span data-k="game"></span></div>
        <div class="arrow">→</div>
      </div>
    </a>
    <a class="note deck" style="--d:1s" data-label="PDF" href="presentacion.html">
      <div class="ico">▤</div>
      <div class="txt"><strong data-k="deck"></strong><span data-k="deck_sub"></span></div>
      <div class="arrow">→</div>
    </a>
  </section>

  <section>
    <h2 data-k="h_contact"></h2>
    <a class="note li" style="--d:1.1s" href="https://www.linkedin.com/in/austinham/" target="_blank" rel="noopener">
      <div class="ico">in</div>
      <div class="txt"><strong>Austin Ham</strong><span>LinkedIn</span></div>
      <div class="arrow">→</div>
    </a>
    <div class="note mail" style="--d:1.25s">
      <div class="ico">@</div>
      <div class="txt"><strong>Email</strong><span class="addr" id="addr">austinham106@gmail.com</span></div>
      <button class="copy" id="copy" type="button" data-k="copy"></button>
      <div class="stamp" id="stamp" data-k="copied"></div>
    </div>
  </section>

  <footer>
    <b>Topogames</b>
    <span data-k="foot"></span>
    <span>Austin Ham · Juan Martin Vianco · Lautaro Perez</span>
  </footer>
</main>
<script>
const T={
 es:{hi:"¡Hola! 👋",tag:"Estudio indie de videojuegos",sub:"Mantengan la oficina funcionando… juntos. Jugá Office Together y escribinos.",h_game:"El juego",game:"Jugalo gratis en itch.io",deck:"Presentación",deck_sub:"Cómo funciona el juego, en 9 diapositivas",h_contact:"Contacto",copy:"COPIAR",copied:"¡COPIADO!",foot:"Arcade cooperativo 2D · GameJamPlus · 48 horas",
   pokes:["¡Hola! 👋","¡Ey, eso hace cosquillas!","¿Jugaste Office Together?","Mejor juntos 🤝","¡Otra vez no!"]},
 en:{hi:"Hi there! 👋",tag:"Indie game studio",sub:"Keep the office running… together. Play Office Together and say hi.",h_game:"The game",game:"Play it free on itch.io",deck:"Pitch deck",deck_sub:"How the game works, in 9 slides",h_contact:"Contact",copy:"COPY",copied:"COPIED!",foot:"2D co-op arcade · GameJamPlus · 48 hours",
   pokes:["Hi there! 👋","Hey, that tickles!","Have you played Office Together?","Better together 🤝","Not again!"]},
 pt:{hi:"Olá! 👋",tag:"Estúdio indie de jogos",sub:"Mantenham o escritório funcionando… juntos. Jogue Office Together e fale com a gente.",h_game:"O jogo",game:"Jogue grátis no itch.io",deck:"Apresentação",deck_sub:"Como o jogo funciona, em 9 slides",h_contact:"Contato",copy:"COPIAR",copied:"COPIADO!",foot:"Arcade cooperativo 2D · GameJamPlus · 48 horas",
   pokes:["Olá! 👋","Ei, isso faz cócegas!","Já jogou Office Together?","Melhor juntos 🤝","De novo não!"]}
};
let cur="es",poke=0;
const $=s=>document.querySelector(s);

// título letra por letra
$("#title").innerHTML=[..."Topogames"].map((c,i)=>`<span style="animation-delay:${.25+i*.05}s">${c}</span>`).join("");

function set(l){
  cur=l;document.documentElement.lang=l;poke=0;
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=T[l][e.dataset.k]);
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>set(b.dataset.l)));

// avatar: rebota y dice algo al tocarlo
const av=$("#avatar");
function boing(){
  av.classList.remove("boing");void av.offsetWidth;av.classList.add("boing");
  poke=(poke+1)%T[cur].pokes.length;$(".bubble").textContent=T[cur].pokes[poke];
  burst(av.getBoundingClientRect());
}
av.addEventListener("click",boing);
av.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();boing()}});

// copiar mail
$("#copy").addEventListener("click",()=>{
  const st=$("#stamp"),ok=()=>{st.classList.add("on");setTimeout(()=>st.classList.remove("on"),1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents($("#addr"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText("austinham106@gmail.com").then(ok,sel)}catch(e){sel()}
  burst($("#copy").getBoundingClientRect());
});

// aviones de papel + papelitos
const cv=$("#planes"),cx=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,planes=[],bits=[];
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);size();
const ink=()=>getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
const cols=()=>["--note-y","--note-p","--note-b","--stamp"].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());
function newPlane(x){return{x:x??-60,y:H*(.1+Math.random()*.8),s:.6+Math.random()*.6,v:.5+Math.random()*.7,ph:Math.random()*6.28,a:.18+Math.random()*.15}}
for(let i=0;i<4;i++)planes.push(newPlane(Math.random()*W));
function drawPlane(p,t){
  const y=p.y+Math.sin(t/900+p.ph)*18,ang=Math.cos(t/900+p.ph)*.25;
  cx.save();cx.translate(p.x,y);cx.rotate(ang);cx.scale(p.s,p.s);cx.globalAlpha=p.a;
  cx.strokeStyle=ink();cx.lineWidth=2.5;cx.lineJoin="round";
  cx.beginPath();cx.moveTo(30,0);cx.lineTo(-24,-14);cx.lineTo(-12,0);cx.lineTo(-24,14);cx.closePath();cx.stroke();
  cx.beginPath();cx.moveTo(30,0);cx.lineTo(-12,0);cx.lineTo(-18,8);cx.stroke();
  cx.restore();
}
function burst(r){
  if(still)return;const c=cols();
  for(let i=0;i<18;i++)bits.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*9,vy:-Math.random()*8-2,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:c[i%4],l:1});
}
function frame(t){
  cx.clearRect(0,0,W,H);
  planes.forEach((p,i)=>{p.x+=p.v;if(p.x>W+60)planes[i]=newPlane();drawPlane(p,t)});
  bits=bits.filter(b=>b.l>0);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.3;b.vx*=.98;b.r+=b.vr;b.l-=.012;
    cx.save();cx.globalAlpha=Math.max(b.l,0);cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-5,-3,10,6);cx.restore()});
  requestAnimationFrame(frame);
}
if(!still)requestAnimationFrame(frame);else{planes.forEach(p=>drawPlane(p,0))}

// idioma inicial
let l="";try{l=localStorage.getItem("lang")||""}catch(e){}
if(!T[l]){const n=(navigator.language||"es").slice(0,2);l=T[n]?n:"en"}
set(l);
</script>
</body>
</html>
